[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
kortex-domain = { path = "crates/domain" }
kortex-application = { path = "crates/application" }
kortex-infrastructure = { path = "crates/infrastructure" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = { version = "=0.37.0", features = ["serde"] }
egui_extras = { version = "=0.37.0", features = ["image"] }
egui_tiles = { version = "=0.18.0", features = ["serde"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
