[package]
name = "kortex-infrastructure"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kortex-domain.workspace = true
kortex-application.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres = "=0.7.18"
tokio-postgres-rustls = { version = "=0.14.0", features = ["ring", "native-certs"] }
